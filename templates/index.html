<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background:#f5f7fa;
    }

    .hero{
        background:linear-gradient(135deg,#0d6efd,#0dcaf0);
        color:white;
        padding:40px;
        border-radius:15px;
        margin-bottom:25px;
    }

    .card{
        border:none;
        border-radius:15px;
        box-shadow:0 4px 20px rgba(0,0,0,.08);
    }

    #result{
        display:none;
    }
</style>
<div class="hero text-center">
    <h1>🏠 House Price Prediction</h1>
    <p class="mb-0">Gradient Boosting Regression Model</p>
</div>

<div class="card p-4">

    <div class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Overall Quality</label>
            <input type="number" class="form-control" id="OverallQual">
        </div>

        <div class="col-md-4">
            <label class="form-label">Living Area (sq ft)</label>
            <input type="number" class="form-control" id="GrLivArea">
        </div>

        <div class="col-md-4">
            <label class="form-label">Garage Capacity</label>
            <input type="number" class="form-control" id="GarageCars">
        </div>

        <div class="col-md-4">
            <label class="form-label">Garage Area</label>
            <input type="number" class="form-control" id="GarageArea">
        </div>

        <div class="col-md-4">
            <label class="form-label">Basement Area</label>
            <input type="number" class="form-control" id="TotalBsmtSF">
        </div>

        <div class="col-md-4">
            <label class="form-label">1st Floor Area</label>
            <input type="number" class="form-control" id="FirstFlrSF">
        </div>

        <div class="col-md-4">
            <label class="form-label">Full Bathrooms</label>
            <input type="number" class="form-control" id="FullBath">
        </div>

        <div class="col-md-4">
            <label class="form-label">Total Rooms</label>
            <input type="number" class="form-control" id="TotRmsAbvGrd">
        </div>

        <div class="col-md-4">
            <label class="form-label">Year Built</label>
            <input type="number" class="form-control" id="YearBuilt">
        </div>

        <div class="col-md-4">
            <label class="form-label">Year Remodeled</label>
            <input type="number" class="form-control" id="YearRemodAdd">
        </div>

        <div class="col-md-4">
            <label class="form-label">MS Zoning</label>
            <select class="form-select" id="MSZoning">
                <option value="RL">RL</option>
                <option value="RM">RM</option>
                <option value="FV">FV</option>
                <option value="RH">RH</option>
                <option value="C (all)">C (all)</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Utilities</label>
            <select class="form-select" id="Utilities">
                <option value="AllPub">AllPub</option>
                <option value="NoSeWa">NoSeWa</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Building Type</label>
            <select class="form-select" id="BldgType">
                <option value="1Fam">1Fam</option>
                <option value="2fmCon">2fmCon</option>
                <option value="Duplex">Duplex</option>
                <option value="Twnhs">Twnhs</option>
                <option value="TwnhsE">TwnhsE</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Heating</label>
            <select class="form-select" id="Heating">
                <option value="GasA">GasA</option>
                <option value="GasW">GasW</option>
                <option value="Floor">Floor</option>
                <option value="Grav">Grav</option>
                <option value="OthW">OthW</option>
                <option value="Wall">Wall</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Kitchen Quality</label>
            <select class="form-select" id="KitchenQual">
                <option value="Ex">Excellent</option>
                <option value="Gd">Good</option>
                <option value="TA">Typical</option>
                <option value="Fa">Fair</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Sale Condition</label>
            <select class="form-select" id="SaleCondition">
                <option value="Normal">Normal</option>
                <option value="Abnorml">Abnormal</option>
                <option value="Partial">Partial</option>
                <option value="Family">Family</option>
                <option value="Alloca">Allocation</option>
                <option value="AdjLand">Adjacent Land</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Land Slope</label>
            <select class="form-select" id="LandSlope">
                <option value="Gtl">Gentle</option>
                <option value="Mod">Moderate</option>
                <option value="Sev">Severe</option>
            </select>
        </div>

    </div>

    <div class="d-grid mt-4">
        <button class="btn btn-primary btn-lg" onclick="predictPrice()">
            Predict House Price
        </button>
    </div>

</div>

<div class="card mt-4 p-4 text-center" id="result">
    <h3>Predicted House Price</h3>
    <h1 class="text-success" id="price"></h1>
</div>
<script>
async function predictPrice(){

    const data = {
        OverallQual: Number(document.getElementById("OverallQual").value),
        GrLivArea: Number(document.getElementById("GrLivArea").value),
        GarageCars: Number(document.getElementById("GarageCars").value),
        GarageArea: Number(document.getElementById("GarageArea").value),
        TotalBsmtSF: Number(document.getElementById("TotalBsmtSF").value),
        "1stFlrSF": Number(document.getElementById("FirstFlrSF").value),
        FullBath: Number(document.getElementById("FullBath").value),
        TotRmsAbvGrd: Number(document.getElementById("TotRmsAbvGrd").value),
        YearBuilt: Number(document.getElementById("YearBuilt").value),
        YearRemodAdd: Number(document.getElementById("YearRemodAdd").value),
        MSZoning: document.getElementById("MSZoning").value,
        Utilities: document.getElementById("Utilities").value,
        BldgType: document.getElementById("BldgType").value,
        Heating: document.getElementById("Heating").value,
        KitchenQual: document.getElementById("KitchenQual").value,
        SaleCondition: document.getElementById("SaleCondition").value,
        LandSlope: document.getElementById("LandSlope").value
    };

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    if(result.error){
        alert(result.error);
        return;
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("price").innerHTML =
        "$ " + Number(result.predicted_price).toLocaleString();
}
</script>
